# Die Oberfläche und der Webhook aus einer Herkunft (ADR-006), hinter einer
# Anmeldung (ADR-009).
#
# Der Browser spricht nur mit diesem Server. Statische Dateien kommen von
# hier, `/webhook/` geht an n8n weiter. Damit gibt es kein CORS, keine
# Preflight-Anfrage und keine Option im Workflow, die eine Sorge der
# Oberfläche in die Orchestrierung trägt. n8n bleibt für den Browser
# unsichtbar.
#
# Identität: Basic Auth gegen eine Passwortdatei. Der geprüfte Benutzername
# geht als `X-Benutzer` an n8n und ersetzt dort den getippten Namen jeder
# Übersteuerung. Das ist kein Benutzerverzeichnis; beim Kunden tritt OIDC an
# dieselbe Stelle, die Nahtstelle bleibt der eine Header (docs/BETRIEB.md).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "ZollPilot";
    auth_basic_user_file /etc/nginx/zollpilot.htpasswd;

    # Scans sind groß. Der Standardwert von 1 MB lehnt eine Sendung mit drei
    # gescannten Belegen ab, mit einer 413-Seite, die niemand versteht.
    client_max_body_size 32m;

    # Für den Healthcheck des Containers: ohne Anmeldung, ohne Inhalt.
    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Wer bin ich: der geprüfte Benutzername im Antwortkopf, damit die
    # Oberfläche ihn zeigen kann, statt ihn abzufragen. Kein `return`: Das
    # liefe vor der Zugriffsprüfung und gäbe jeden mitgeschickten Namen
    # ungeprüft zurück. `empty_gif` ist ein Inhaltshandler und kommt erst
    # nach der Anmeldung dran.
    location = /wer {
        empty_gif;
        add_header X-Benutzer $remote_user always;
        add_header Cache-Control "no-store" always;
    }

    # Die gehashten Dateinamen des Angular-Baus sind unveränderlich; index.html
    # darf nie aus dem Zwischenspeicher kommen, sonst zeigt ein Browser nach
    # dem nächsten Bau auf verschwundene Dateien.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der geprüfte Name. proxy_set_header ersetzt, was ein Browser selbst
        # in diesen Header geschrieben hätte; nur nginx bestimmt ihn.
        proxy_set_header X-Benutzer $remote_user;

        # Eine Akte mit gescannten Belegen läuft durch Tesseract. Der
        # Standardwert von 60 Sekunden bricht das mitten im Lesen ab.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Multipart unverändert durchreichen: Zwischenspeichern der Anfrage
        # kostet bei großen PDFs nur Zeit und Platte.
        proxy_request_buffering off;
    }
}
