[project]
name = "zollpilot-extraktion"
version = "0.1.0"
description = "Stufe 3 von ZollPilot: aus Belegen (PDF) werden Assertions mit Konfidenz und Fundstelle. Extrahiert, klassifiziert, normalisiert - entscheidet nie (ADR-003, ADR-005)."
requires-python = ">=3.12"
dependencies = [
  "pdfplumber>=0.11.4",
  "pypdfium2>=4.30.0",
  "pytesseract>=0.3.13",
  "pillow>=11.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.12",
  "lxml>=6.1.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zollpilot_extraktion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
