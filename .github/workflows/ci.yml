name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Die Pipeline prüft, sie veröffentlicht nichts. Mehr Rechte braucht sie nicht.
# Jede Action ist auf einen Commit gepinnt; die Hauptversion steht als
# Kommentar dahinter. Ein Tag kann verschoben werden, ein Commit nicht.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Zwei Zwecke: Qualität sichern und als Geländer für agentische Änderungen
# dienen. Ein Agent, der gegen eine Projektregel verstößt, bekommt hier ein
# rotes Ergebnis statt eines Review-Kommentars, den niemand schreibt.

jobs:
  belege:
    name: Beleg-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Belege prüfen
        run: bash scripts/beleg-check.sh

  dokumente:
    name: Prosa und Verweise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Der Git-Hook prüft nur vorgemerkte Dateien und ist umgehbar. Hier
      # läuft dieselbe Prüfung über den ganzen Baum.
      - name: Prosa prüfen
        run: node scripts/prosa-check.mjs
      - name: Verweise prüfen
        run: node scripts/link-check.mjs

  regeln:
    name: Regeln sind Daten
    runs-on: ubuntu-latest
    # Katalog vollständig, docs/03 deckungsgleich, jede Regel mit Code und
    # Test, keine nackte Zahl in src/regeln/ (ADR-002). Falscher Code fällt
    # im Test auf, falsche Fachlogik nicht — das ist der Job, der das abfängt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Regel-Check
        run: node scripts/regel-check.mjs
      # Das Gate wird selbst getestet, mit den Fixtures für die Fälle, die
      # stumm bleiben könnten.
      - name: Regel-Check testen
        run: node --test scripts/regel-check.test.mjs

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validatoren, Regeln, Akte, Testakten
        run: npm test
      # Die Testakten im Repo müssen die sein, die der Generator erzeugt.
      - name: Testakten sind reproduzierbar
        run: node testdaten/erzeuge-akten.mjs && git diff --exit-code -- testdaten/akten

  workflows:
    name: Workflow ist Artefakt
    runs-on: ubuntu-latest
    # Der Code-Node muss aus dem aktuellen src/ stammen (ADR-004), und die
    # Workflow-Dateien müssen strukturell gültig und frei von Geheimnissen sein.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Bundle ist aktuell
        run: node scripts/n8n-bundle.mjs --check
      - name: Workflow-Struktur
        run: node scripts/workflow-check.mjs
      # Der eigene Node: aus TypeScript gebaut, dist/ liegt im Repo, weil
      # compose.yml es direkt einhängt. Hier wird nachgebaut und verglichen,
      # damit dist/ nie älter ist als die Quelle. Dann die Tests ohne n8n.
      - name: Eigener Node, Abhängigkeiten
        working-directory: nodes/n8n-nodes-zollpilot
        run: npm ci
      - name: Eigener Node, dist ist aktuell
        working-directory: nodes/n8n-nodes-zollpilot
        run: npm run build && git diff --exit-code -- dist
      - name: Eigener Node, Tests
        working-directory: nodes/n8n-nodes-zollpilot
        run: npm test

  extraktion:
    name: Extraktion (Python, OCR)
    runs-on: ubuntu-latest
    # Stufe 3: PDF → Assertions (ADR-005). Erst die Tests, dann die Belege neu
    # erzeugen — sie müssen byteidentisch mit dem Repo sein —, dann die
    # Bewertung gegen die Basislinie im Repo: Field Exact Match je Belegtyp
    # und die Entscheidung je Akte über src/cli.mjs. Ohne Basislinie ist der
    # Lauf rot, nie stumm grün.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
      # uv über das Installationsskript mit fester Version statt über eine
      # Action: gleiche Version wie im Dockerfile, kein weiterer Pin zu pflegen.
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.12.12/install.sh | sh
      - name: Abhängigkeiten
        working-directory: extraktion
        run: uv sync --frozen
      - name: Tests
        working-directory: extraktion
        run: uv run pytest
      - name: Belege sind reproduzierbar
        working-directory: extraktion
        run: uv run python ../testdaten/erzeuge-belege.py && git diff --exit-code -- ../testdaten/belege
      - name: Bewertung gegen Basislinie
        working-directory: extraktion
        run: uv run python -m zollpilot_extraktion.bewertung

  oberflaeche:
    name: Oberfläche (Angular, axe)
    runs-on: ubuntu-latest
    # Stufe 4 (ADR-006). Der Kontrast-Check rechnet die Zusagen der
    # Gestaltungstoken nach, die Unit-Tests prüfen Zustand und Darstellung,
    # und Playwright lässt axe über jede Ansicht laufen — das ist die
    # Merge-Bedingung für jede Änderung an der Oberfläche
    # (docs/ARBEITSWEISE.md, Stufe 2).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oberflaeche/package-lock.json
      - name: Abhängigkeiten
        working-directory: oberflaeche
        run: npm ci
      - name: Kontrast der Gestaltungstoken
        run: node scripts/kontrast-check.mjs
      - name: Bauen
        working-directory: oberflaeche
        run: npm run build
      - name: Tests
        working-directory: oberflaeche
        run: npm test
      - name: Browser für axe
        working-directory: oberflaeche
        run: npm run e2e:install
      - name: Barrierefreiheit und Bedienung
        working-directory: oberflaeche
        run: npm run e2e
      # Die Diagramme unter docs/bilder/ sind aus docs/prozess/ gezeichnet
      # (Graphviz für .dot, bpmn-js im selben Chromium für .bpmn). Hier, weil
      # der Browser schon da ist; rot, wenn ein Bild nicht mehr zu seiner
      # Quelle passt.
      - name: Abhängigkeiten der Wurzel
        run: npm ci
      - name: Diagramme sind auf Stand
        run: node scripts/diagramme-zeichnen.mjs --pruefen
      - name: Bericht bei Fehler
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-bericht
          path: oberflaeche/playwright-report/
          retention-days: 7

  betrieb:
    name: Stack läuft und entscheidet
    runs-on: ubuntu-latest
    needs: [tests, workflows, extraktion, oberflaeche]
    # Der teuerste Job und der einzige, der beweist, dass Compose, Import,
    # gebündelter Code-Node, Extraktionsdienst, Schema und Webhook zusammen
    # funktionieren: Stack hochfahren (baut Extraktion und Oberfläche), sieben
    # Akten über /webhook/akte, sieben Belegsätze (PDF) über /webhook/belege
    # und eine Akte über den nginx-Proxy der Oberfläche, Entscheidungen gegen
    # die Erwartung, Prüfungen in Postgres.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Umgebung
        run: cp .env.example .env
      - name: Stack hochfahren
        run: docker compose up -d --build --wait
      - name: Rauchtest
        run: bash scripts/rauchtest.sh
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color
      - name: Stack abbauen
        if: always()
        run: docker compose down -v
