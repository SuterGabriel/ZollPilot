# Ein Befehl fährt alles hoch:  docker compose up -d --wait
#
# Neun Dienste, fünf für die Akte und vier fürs Hinsehen:
#   postgres    eine Instanz, zwei Datenbanken: n8n (Workflows, Ausführungen)
#               und zollpilot (Akte, Prüfungen, Fehler), deploy/postgres/init.sql
#   n8n-import  läuft einmal: importiert Credentials und die Workflows aus
#               workflows/ und beendet sich. Damit ist der Stand im Repo der
#               Stand im System, nicht umgekehrt.
#   n8n         die Orchestrierung, mit Healthcheck und Metriken
#   extraktion  der Extraktionsdienst (Python, Textlayer und Tesseract,
#               ADR-005), gebaut aus extraktion/Dockerfile. n8n ruft ihn per
#               HTTP unter http://extraktion:8080; er entscheidet nichts.
#   oberflaeche nginx: liefert die gebaute Angular-Anwendung aus und reicht
#               /webhook/ an n8n weiter. Gleiche Herkunft, deshalb kein CORS
#               (ADR-006). Der Einstieg für Menschen: http://localhost:8088
#   prometheus  holt die Metriken ab: n8n, Extraktion, SQL-Exporter. Wertet
#               die Alarmregeln aus (deploy/prometheus/). http://localhost:9090
#   alertmanager nimmt die Alarme entgegen und liefert sie an n8n
#               (/webhook/alarm), wo sie als Zeile in `alarm` landen.
#   sql-exporter macht aus der Prüftabelle die fachlichen Zähler: Freigaben,
#               Befunde je Regel, Fehler, offene Wiedervorlagen. Der
#               Code-Node kann nichts exportieren; die Tabelle ist ohnehin
#               der Ort der Wahrheit (deploy/sql-exporter/).
#   grafana     das Dashboard, aus dem Repo provisioniert (deploy/grafana/).
#               http://localhost:3000, Lesen ohne Anmeldung.
#
# Der Stack braucht n8n, Postgres und die Extraktion; das Monitoring ist
# Zuschauer. Fällt Grafana aus, prüft ZollPilot weiter.
#
# Geheimnisse liegen in .env (Vorlage: .env.example). Die Werte dort sind
# Entwicklungswerte; docs/BETRIEB.md sagt, was vor einem echten Betrieb fehlt.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zollpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zollpilot-dev}
      POSTGRES_DB: n8n
    volumes:
      - postgres-daten:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-zollpilot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zollpilot} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-1.114.0}
    environment: &n8n-umgebung
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-zollpilot}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-zollpilot-dev}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-nur-fuer-lokale-entwicklung-ersetzen}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
    volumes:
      - ./workflows:/workflows:ro
      - ./deploy/n8n:/deploy:ro
    entrypoint: ["/bin/sh", "-c"]
    # Erst Credentials, dann Workflows. Der Import ersetzt Workflows mit
    # gleicher id; ein zweiter Start ist idempotent. Der Import deaktiviert
    # jeden Workflow ("Remember to activate later"); deshalb der dritte
    # Befehl, sonst antwortet der Webhook mit 404. Der Fehler-Workflow wird
    # nicht aktiviert: Ein Error Trigger startet über die Einstellung
    # errorWorkflow der anderen Workflows, und n8n verweigert die Aktivierung
    # eines Workflows ohne Trigger-Node.
    command:
      - |
        set -e
        n8n import:credentials --input=/deploy/credentials.json
        n8n import:workflow --separate --input=/workflows
        n8n update:workflow --id=zollpilot-akte-pruefen --active=true
        n8n update:workflow --id=zollpilot-wiederholen --active=true
        n8n update:workflow --id=zollpilot-alarm --active=true
        echo "Import abgeschlossen: Prüf-, Wiederholungs- und Alarm-Workflow aktiv."
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-1.114.0}
    environment:
      <<: *n8n-umgebung
      N8N_PORT: 5678
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Ohne die Ereignisbus-Metriken liefert /metrics nur Prozess- und
      # Node-Werte: CPU, Heap, Eventloop. Das sagt, ob n8n lebt, nie ob eine
      # Prüfung gelaufen oder gescheitert ist, und genau danach fragt ein
      # Alarm. Erst dieser Schalter erzeugt die Zähler je Ereignis
      # (`n8n_events_*`), die Labels machen sie je Workflow lesbar.
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: "true"
      N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: "true"
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n-daten:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  extraktion:
    build:
      context: .
      dockerfile: extraktion/Dockerfile
    image: zollpilot-extraktion:dev
    environment:
      EXTRAKTION_OCR_SPRACHEN: deu+eng
    # Auf dem Host unter 8765, weil 8080 auf Entwicklermaschinen selten frei
    # ist; im Compose-Netz antwortet der Dienst auf 8080 (Workflow-Node).
    ports:
      - "127.0.0.1:${EXTRAKTION_PORT:-8765}:8080"
    # Der Healthcheck steht im Dockerfile: GET /healthz antwortet ok und sagt,
    # ob Tesseract da ist. n8n hängt nicht von diesem Dienst ab; der Eingang
    # /webhook/akte funktioniert ohne ihn; /webhook/belege scheitert dann
    # sichtbar (workflow_fehler), nicht still.

  oberflaeche:
    build:
      context: .
      dockerfile: oberflaeche/Dockerfile
    image: zollpilot-oberflaeche:dev
    ports:
      - "127.0.0.1:${OBERFLAECHE_PORT:-8088}:8080"
    # Der Healthcheck steht im Dockerfile. `depends_on` auf n8n ist Absicht:
    # Ohne n8n kann die Oberfläche nichts einreichen, und ein Proxy, der ins
    # Leere zeigt, meldet 502 statt eines Fehlers, den jemand versteht.
    depends_on:
      n8n:
        condition: service_healthy

  # --- Monitoring: Zuschauer, keine Abhängigkeit der Akte -------------------

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alarme.yml:/etc/prometheus/alarme.yml:ro
      - prometheus-daten:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.1}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  sql-exporter:
    image: burningalchemist/sql_exporter:${SQL_EXPORTER_VERSION:-0.18.0}
    # Die Verbindung kommt aus .env über das Flag, nicht aus der
    # Konfigurationsdatei: Dort steht dann kein Passwort.
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -config.data-source-name=postgresql://${POSTGRES_USER:-zollpilot}:${POSTGRES_PASSWORD:-zollpilot-dev}@postgres:5432/zollpilot?sslmode=disable
    volumes:
      - ./deploy/sql-exporter:/etc/sql_exporter:ro
    # Kein Healthcheck: Das Image hat keine Shell. Ob der Exporter lebt, sagt
    # Prometheus (`up{job="sql-exporter"}`), und dafür gibt es einen Alarm.
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.0}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORT:-zollpilot-dev}
      # Lesen ohne Konto, auf localhost. Vor einem Betrieb außerhalb der
      # eigenen Maschine abschalten (docs/BETRIEB.md).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-daten:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres-daten:
  n8n-daten:
  prometheus-daten:
  grafana-daten:
